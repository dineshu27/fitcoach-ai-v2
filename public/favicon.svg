<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!-- Antenna -->
  <line x1="24" y1="2" x2="24" y2="9" stroke="#8A7FFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="24" cy="2" r="2" fill="#8A7FFF" filter="url(#glow)"/>
  <!-- Head -->
  <rect x="8" y="9" width="32" height="22" rx="6" fill="#8A7FFF" opacity="0.2" stroke="#8A7FFF" stroke-width="1.2"/>
  <!-- Face plate -->
  <rect x="12" y="12" width="24" height="16" rx="4" fill="#000" opacity="0.4" stroke="#8A7FFF" stroke-width="0.6"/>
  <!-- Left eye -->
  <rect x="14" y="15" width="8" height="6" rx="2" fill="white" opacity="0.9"/>
  <circle cx="18" cy="18" r="2.5" fill="#8A7FFF"/>
  <!-- Right eye -->
  <rect x="26" y="15" width="8" height="6" rx="2" fill="white" opacity="0.9"/>
  <circle cx="30" cy="18" r="2.5" fill="#8A7FFF"/>
  <!-- Mouth -->
  <path d="M 17 23 Q 24 27 31 23" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="20" y="31" width="8" height="4" rx="2" fill="#8A7FFF" opacity="0.4"/>
  <!-- Body -->
  <rect x="7" y="34" width="34" height="12" rx="5" fill="#8A7FFF" opacity="0.18" stroke="#8A7FFF" stroke-width="1.2"/>
  <!-- Shoulders -->
  <rect x="2" y="35" width="6" height="8" rx="3" fill="#8A7FFF" opacity="0.25"/>
  <rect x="40" y="35" width="6" height="8" rx="3" fill="#8A7FFF" opacity="0.25"/>
  <!-- FiTAI text -->
  <text x="24" y="43" text-anchor="middle" font-size="5" font-weight="800" font-family="sans-serif" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">FiTAI</text>
</svg>
